<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAVARI Kapture - Redirecting...</title>
  <script>
    // Check if we need to redirect
    const currentPath = window.location.pathname;
    const baseUrl = window.location.origin + '/kavari-kapture';
    
    if (!currentPath.includes('/kavari-kapture/')) {
      window.location.replace(baseUrl);
    }
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #5F1DA6;
      color: white;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 2rem;
    }
    .loader {
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 5px solid #E8BC4F;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Redirecting to KAVARI Kapture</h1>
    <div class="loader"></div>
    <p>If you're not redirected automatically, <a href="/kavari-kapture/" style="color: #E8BC4F;">click here</a>.</p>
  </div>
</body>
</html>
